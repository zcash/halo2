[workspace]
resolver = "2"
members = [
    "halo2",
    "halo2_gadgets",
    "halo2_poseidon",
    "halo2_proofs",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/halo2"

[workspace.dependencies]
# Intra-workspace dependencies
halo2_proofs = { version = "0.3", path = "halo2_proofs", default-features = false }
halo2_poseidon = { version = "0.1", path = "halo2_poseidon", default-features = false }
halo2_gadgets = { version = "0.5", path = "halo2_gadgets", default-features = false }

# Cryptography
bitvec = { version = "1", default-features = false }
blake2b_simd = "1"
ff = { version = "0.14", default-features = false, features = ["alloc"] }
group = "0.14"
pasta_curves = "0.6"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = { version = "0.10", default-features = false }
sinsemilla = "0.2"
subtle = "2.3"
uint = "0.9.2" # MSRV 1.56.1

# Correctness
arrayvec = "0.7"
indexmap = "1"

# Performance
lazy_static = "1"
maybe-rayon = { version = "0.1", default-features = false}

# Developer tooling dependencies
backtrace = "0.3"
plotters = { version = "0.3", default-features = false }
tabbycat = "0.1"
tracing = "0.1"

# Legacy circuit compatibility
halo2_legacy_pdqsort = "0.1"

# Testing
assert_matches = "1.5"
criterion = "0.3"
gumdrop = "0.8"
proptest = "1"
